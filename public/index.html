<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HB Analyst</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8f7f4;
      color: #1a1a2e;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.1));
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: normal;
      letter-spacing: 0.04em;
      color: #1a1a2e;
    }

    h1 span {
      color: #2e6da4;
    }

    .tagline {
      margin-top: 1rem;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: #666;
      max-width: 500px;
      line-height: 1.7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .divider {
      margin: 2rem auto;
      width: 60px;
      height: 2px;
      background: #2e6da4;
      opacity: 0.4;
    }

    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      color: #999;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <img src="computer.png" alt="HB Analyst" class="logo" />
  <h1>HB <span>Analyst</span></h1>
  <p class="tagline">Data-driven insight for the home building industry. Something useful is on the way.</p>
  <div class="divider"></div>
  <p class="badge">coming soon</p>
</body>
</html>
